name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (errors block the build)
        run: shellcheck -S error hooks/*.sh scripts/*.sh tests/*.sh
      - name: shellcheck (warnings, report only)
        continue-on-error: true
        run: shellcheck -S warning hooks/*.sh scripts/*.sh tests/*.sh
      - name: JSON files parse
        run: |
          for f in $(git ls-files '*.json'); do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$f" || { echo "invalid JSON: $f"; exit 1; }
          done
      - name: shell scripts are LF
        run: |
          if git ls-files '*.sh' | xargs grep -l $'\r'; then echo "CRLF in shell scripts"; exit 1; fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: end-to-end tests in a sandboxed HOME
        shell: bash
        run: bash tests/run.sh
